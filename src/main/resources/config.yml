bootstrap:
  log-dir: /var/log/flow/agent.log
  log-level: DEBUG
  jfr-file: /var/log/flow/context.jfr

agent:
  spring-jfr: true
  flow-recording: true
  verbose: false

flow:
  stack-output: ../stacks
  type:
    include:
      start-on:
        - ru.dev
    exclude:
      contains:
        - ru.dev.flow.filters
  method:
    exclude:
      equals:
        - toString