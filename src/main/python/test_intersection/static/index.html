<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Overlap search</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>Поиск пересечений тестов</h1>

<!-- ==================== 1. Поиск теста ==================== -->

<input id="q"
       placeholder="Поиск по классу, методу или имени теста..."
       autocomplete="off"
       autofocus>

<div class="legend">
  <span style="background:#7bb86f"></span>успешный
  <span style="background:#e25c4a; margin-left:1rem"></span>упавший
  <span style="background:#9aa4ad; margin-left:1rem"></span>прочее
  <span style="border:2px solid #222; width:8px; height:8px; background:transparent; margin-left:1rem"></span>искомый тест
</div>

<div id="results"></div>

<!-- ==================== 2. Таймлайн группы тестов ==================== -->

<div class="group-selector">
  <h3>Таймлайн для группы тестов</h3>

  <div class="multi-select">
    <input type="text"
           class="multi-select-input"
           id="groupInput"
           placeholder="Выберите тесты (поиск по классу, методу, имени)..."
           autocomplete="off"
           readonly>

    <div class="multi-select-dropdown" id="groupDropdown">
      <div class="multi-select-search">
        <input type="text"
               id="groupSearch"
               placeholder="Поиск..."
               autocomplete="off"
               onclick="event.stopPropagation()">
      </div>
      <div id="groupOptions"></div>
    </div>
  </div>

  <div class="select-actions">
    <button type="button" id="selectAllBtn">Выбрать все видимые</button>
    <button type="button" id="clearAllBtn">Очистить</button>
  </div>

  <div class="selected-tags" id="selectedTags"></div>

  <button type="button" class="build-timeline-btn" id="buildBtn" disabled>
    Построить таймлайн тестов
  </button>

  <div id="groupTimeline"></div>
</div>

<!-- ==================== 3. Смешанный таймлайн: тесты + события ==================== -->

<div class="group-selector">
  <h3>Таймлайн тестов и событий</h3>

  <div class="multi-select">
    <input type="text"
           class="multi-select-input"
           id="mixedTestsInput"
           placeholder="Выберите тесты (поиск по классу, методу, имени)..."
           autocomplete="off"
           readonly>

    <div class="multi-select-dropdown" id="mixedTestsDropdown">
      <div class="multi-select-search">
        <input type="text"
               id="mixedTestsSearch"
               placeholder="Поиск..."
               autocomplete="off"
               onclick="event.stopPropagation()">
      </div>
      <div id="mixedTestsOptions"></div>
    </div>
  </div>

  <div class="select-actions">
    <button type="button" id="mixedSelectAllBtn">Выбрать все видимые</button>
    <button type="button" id="mixedClearAllBtn">Очистить</button>
  </div>

  <div class="selected-tags" id="mixedSelectedTags"></div>

  <div class="event-types-block">
    <div class="event-types-header">
      <strong>Типы событий</strong>
      <div class="select-actions" style="margin:0">
        <button type="button" id="eventTypesAllBtn">Все</button>
        <button type="button" id="eventTypesNoneBtn">Ничего</button>
      </div>
    </div>
    <div class="event-types-list" id="eventTypesList">
      <div class="empty">Загрузка типов событий...</div>
    </div>
  </div>

  <button type="button" class="build-timeline-btn" id="mixedBuildBtn" disabled>
    Построить смешанный таймлайн
  </button>

  <div id="mixedTimeline"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
