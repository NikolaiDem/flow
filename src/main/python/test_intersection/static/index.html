<!DOCTYPE html>
<!--
  index.html — единственная страница UI.

  Секции:
    1. Поиск одного теста          (GET /search?q=...)
    2. Групповой таймлайн тестов   (POST /group-timeline {keys})
    3. Таймлайн событий            (POST /mixed-timeline {event_types})
    4. Таймлайн по потокам         (GET /threads-timeline)

  Вся динамика — в /app.js и /threads.js. Этот файл — только разметка
  и id-хуки, за которые цепляются скрипты.

  Все id здесь обязаны совпадать с document.getElementById(...)
  в соответствующих js-файлах. Если id переименовать — JS получит null
  и упадёт на addEventListener.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>JFR timeline</title>

<!--
  Стили. Отдаётся handler._send_static("style.css", "text/css; ...").
  Содержит:
    - общий layout (.item, .name, .row, .bar, .legend, .group-selector)
    - цвета баров (.bar.passed / .failed / .other / .event / .context /
      .test-event / .jfr-gc / .jfr-cpu / .jfr-thread / .jfr-io / .jfr-system)
    - верстку мультиселекта (.multi-select*)
    - верстку блока типов событий (.event-types*)
    - верстку таймлайна по потокам (.timeline-toolbar, .timeline-scroll,
      .tl-row, .timeline-overview)
-->
<link rel="stylesheet" href="/style.css">
</head>
<body>

<h1>JFR timeline</h1>


<!-- =========================================================================
     СЕКЦИЯ 1. Поиск одного теста
     ========================================================================= -->

<!--
  Поле поиска теста.
  id="q" — читается в app.js: const q = document.getElementById('q').
  На input навешан дебаунс 150 мс и вызов searchOne().
  searchOne() дёргает GET /search?q=... и рендерит результат в #results.
-->
<input id="q"
       placeholder="Поиск по классу, методу или имени теста..."
       autocomplete="off"
       autofocus>

<!--
  Легенда цветов баров.
  Не интерактивная — просто объясняет пользователю, что означает цвет.
  Цвета совпадают с CSS-классами .bar.*.
-->
<div class="legend">
  <span style="background:#2e9e44"></span>успешный тест
  <span style="background:#d63a2f; margin-left:1rem"></span>упавший тест
  <span style="background:#8a8f98; margin-left:1rem"></span>прочее
  <span style="background:#3f8fdc; margin-left:1rem"></span>Spring
  <span style="background:#7a5fd6; margin-left:1rem"></span>JUnit-обвязка
  <span style="background:#2fae91; margin-left:1rem"></span>GC
  <span style="background:#f08c2a; margin-left:1rem"></span>CPU
  <span style="background:#b048a8; margin-left:1rem"></span>потоки
  <span style="background:#3ec1e5; margin-left:1rem"></span>IO
  <span style="background:#c9b23a; margin-left:1rem"></span>JFR system
  <span style="border:3px solid #111; width:8px; height:8px; background:transparent; margin-left:1rem"></span>найденное
</div>

<!--
  Контейнер результатов поиска.
  Пустой — наполняется из renderSearchResults(items).
  Каждый item — карточка: имя теста + таймлайн + список пересечений.
-->
<div id="results"></div>


<!-- =========================================================================
     СЕКЦИЯ 2. Групповой таймлайн тестов
     ========================================================================= -->

<div class="group-selector">
  <h3>Таймлайн для группы тестов</h3>

  <div class="multi-select">
    <!-- Видимое поле мультиселекта. Клик открывает/закрывает дропдаун. -->
    <input type="text"
           class="multi-select-input"
           id="groupInput"
           placeholder="Выберите тесты (поиск по классу, методу, имени)..."
           autocomplete="off"
           readonly>

    <!-- Сам дропдаун. По умолчанию скрыт; .open делает его видимым. -->
    <div class="multi-select-dropdown" id="groupDropdown">
      <div class="multi-select-search">
        <input type="text"
               id="groupSearch"
               placeholder="Поиск..."
               autocomplete="off"
               onclick="event.stopPropagation()">
      </div>
      <div id="groupOptions"></div>
    </div>
  </div>

  <div class="select-actions">
    <button type="button" id="selectAllBtn">Выбрать все видимые</button>
    <button type="button" id="clearAllBtn">Очистить</button>
  </div>

  <!-- Теги выбранных тестов. -->
  <div class="selected-tags" id="selectedTags"></div>

  <!-- Кнопка построения. Активна при selected.size >= 2. -->
  <button type="button" class="build-timeline-btn" id="buildBtn" disabled>
    Построить таймлайн тестов
  </button>

  <!-- Контейнер результата. -->
  <div id="groupTimeline"></div>
</div>


<!-- =========================================================================
     СЕКЦИЯ 3. Таймлайн событий
     ========================================================================= -->

<div class="group-selector">
  <h3>Таймлайн событий</h3>

  <!-- Мультиселект тестов в этой секции сейчас не используется;
       оставлен для совместимости с app.js. Если убирать — удалять и в JS. -->
  <div class="multi-select">
    <input type="text"
           class="multi-select-input"
           id="mixedTestsInput"
           placeholder="Выберите тесты (поиск по классу, методу, имени)..."
           autocomplete="off"
           readonly>

    <div class="multi-select-dropdown" id="mixedTestsDropdown">
      <div class="multi-select-search">
        <input type="text"
               id="mixedTestsSearch"
               placeholder="Поиск..."
               autocomplete="off"
               onclick="event.stopPropagation()">
      </div>
      <div id="mixedTestsOptions"></div>
    </div>
  </div>

  <div class="select-actions">
    <button type="button" id="mixedSelectAllBtn">Выбрать все видимые</button>
    <button type="button" id="mixedClearAllBtn">Очистить</button>
  </div>

  <div class="selected-tags" id="mixedSelectedTags"></div>

  <!--
    Блок чекбоксов типов событий.
    Наполняется из app.js: renderEventTypes() на основе GET /event-types.
  -->
  <div class="event-types-block">
    <div class="event-types-header">
      <strong>Типы событий</strong>
      <div class="select-actions" style="margin:0">
        <button type="button" id="eventTypesAllBtn">Все</button>
        <button type="button" id="eventTypesNoneBtn">Ничего</button>
      </div>
    </div>

    <div class="event-types-list" id="eventTypesList">
      <div class="empty">Загрузка типов событий...</div>
    </div>
  </div>

  <!-- Кнопка построения. Активна при selectedEventTypes.size > 0. -->
  <button type="button" class="build-timeline-btn" id="mixedBuildBtn" disabled>
    Построить таймлайн событий
  </button>

  <!-- Контейнер результата. -->
  <div id="mixedTimeline"></div>
</div>


<!-- =========================================================================
     СЕКЦИЯ 4. Таймлайн по потокам
     ========================================================================= -->

<div class="group-selector">
  <h3>Таймлайн по потокам</h3>

  <!--
    Панель управления:
      #tlSearch      — поиск по имени события, подсвечивает совпадения.
      #tlToStart     — прыжок в начало оси.
      #tlToEnd       — прыжок в конец оси.
      #tlZoom1/10/100 — предустановленный зум к центру.
      #tlZoomReset   — вернуть весь диапазон.
      #tlZoomInfo    — текстом текущий масштаб и видимый интервал.
  -->
  <div class="timeline-toolbar">
    <input id="tlSearch"
           placeholder="Поиск по имени события..."
           autocomplete="off">

    <button type="button" id="tlToStart" title="В начало">⏮</button>
    <button type="button" id="tlToEnd"   title="В конец">⏭</button>

    <button type="button" id="tlZoom1">×1</button>
    <button type="button" id="tlZoom10">×10</button>
    <button type="button" id="tlZoom100">×100</button>
    <button type="button" id="tlZoomReset">Сбросить</button>

    <span id="tlZoomInfo" class="zoom-info"></span>
  </div>

  <!--
    Сам таймлайн. Каждая дорожка = поток (thread_name).
    Наполняется из threads.js: renderThreadsTimeline().
    Обёртка #tlInner нужна для возможных будущих манипуляций с шириной;
    сейчас ширина 100%, прокрутка делается через tlOffset + пересчёт left.
  -->
  <div class="timeline-scroll" id="tlScroll">
    <div class="timeline-inner" id="tlInner">
      <div id="tlThreads"></div>
      <div id="tlAxis"></div>
    </div>
  </div>

  <!--
    Мини-карта (overview) — тонкая полоса с прямоугольником видимой области.
    Позволяет видеть, где ты находишься на всей оси, и прыгать/тащить окно.
    Наполняется из threads.js: updateOverviewWindow().
  -->
  <div class="timeline-overview" id="tlOverview">
    <div class="timeline-overview-window" id="tlOverviewWindow"></div>
  </div>
</div>


<!--
  Подключение JS в самом низу <body>:
    - DOM уже построен, все getElementById(...) вернут реальные элементы.
    - app.js     — секции 1–3 (поиск, группа тестов, таймлайн событий).
    - threads.js — секция 4 (таймлайн по потокам с зумом и мини-картой).
-->
<script src="/app.js"></script>
<script src="/threads.js"></script>

</body>
</html>
